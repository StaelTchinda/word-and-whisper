name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secrets are not exposed to pull requests from forks, and the `secrets`
  # context cannot be read in a job-level `if:`. github.* can, so decide once
  # here and let every data-dependent job key off it.
  guard:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.q.outputs.trusted }}
    steps:
      - id: q
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR — data-dependent jobs skipped (no PRAYER_DATA_URL)."
          fi

  # Runs for everyone, forks included. Needs no data and no secrets.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: make install PY=python
      - name: Byte-compile everything
        run: python -m compileall -q backend/src backend/tests
      # app.py builds the corpus in `lifespan`, not at import, so importing it
      # is a real check that needs no data on disk.
      - name: Import smoke
        run: |
          python -c "
          import prayer.api.app, prayer.api.build.index, prayer.api.build.golden
          import prayer.extract.text, prayer.extract.parks, prayer.bench.build_tier1
          print('imports ok')"

  test:
    needs: guard
    if: needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-data
        with:
          data-url: ${{ secrets.PRAYER_DATA_URL }}
      - name: pytest — 179 tests, latency budgets excluded
        working-directory: backend
        run: python -m pytest -q -m "not perf" --durations=10

  # Never blocks a merge: the budgets are tuned for a quiet machine and shared
  # runners are neither quiet nor consistent. `make test` locally applies no
  # filter, so all 183 still run strict on your laptop.
  perf:
    needs: guard
    if: needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-data
        with:
          data-url: ${{ secrets.PRAYER_DATA_URL }}
      - name: pytest -m perf (advisory)
        id: perf
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q -m perf -rA 2>&1 | tee perf.log
      - name: Surface the numbers in the run summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "### Latency budgets (advisory)"
            echo '```'
            grep -Ei 'p50|p95|passed|failed' perf.log | tail -20 || tail -20 perf.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: guard
    if: needs.guard.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the deploy image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/deploy/Dockerfile
          build-args: |
            PRAYER_DATA_URL=${{ secrets.PRAYER_DATA_URL }}
          load: true
          tags: prayer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container on its own default port
        run: docker run -d --name prayer -p 8000:8000 prayer:ci

      # /health returns HTTP 200 even when status is "degraded" (app.py), so a
      # status-code check would wave through an image with an empty corpus.
      # Assert on the body.
      - name: /health must report status=ok
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if body=$(curl -fsS http://127.0.0.1:8000/health 2>/dev/null); then
              [ "$(echo "$body" | jq -r .status)" = "ok" ] && break
            fi
            sleep 2
          done
          echo "$body"
          echo "$body" | jq -e '.status == "ok" and .prayers > 0 and .passages > 0'

      - name: /suggest must return a real suggestion
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/suggest \
            -H 'content-type: application/json' \
            -d '{"situation":"I am anxious about my job and cannot sleep","k":3}' \
          | jq -e '.abstained == false and (.suggestions | length) > 0'

      # This number decides which Render plan you need; free/starter are 512 MB.
      - name: Record resident memory
        run: |
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}}' prayer \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Render injects PORT and routes to it. Proves the fix in api/__main__.py.
      - name: Must bind a platform-injected PORT
        run: |
          set -euo pipefail
          docker rm -f prayer
          docker run -d --name prayer10k -e PORT=10000 -p 10000:10000 prayer:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:10000/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::container did not bind PORT=10000"
          exit 1

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs prayer 2>&1 | tail -100 || true
          docker logs prayer10k 2>&1 | tail -100 || true

  # No deploy job: both Render services have autoDeploy: true and deploy
  # themselves the moment a commit lands on main. Safety comes from branch
  # protection instead of a CI-triggered deploy — main requires a PR with
  # quick/test/docker passing, so nothing untested can reach the branch
  # Render is watching. See render.yaml and the README's CI/CD section.
