name: build-data
description: >-
  Install the package and build every artifact under backend/data/ that the
  test suite needs. Shared by the `test` and `perf` jobs.

inputs:
  data-url:
    description: >-
      Direct-download link to a .zip or .tar.gz of backend/data/input/,
      needing no credentials. The source books are copyrighted and are not in
      this repository, so CI cannot build the datasets without it.
    required: true
  python-version:
    description: Matches backend/deploy/Dockerfile's python:3.12-slim
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: backend/pyproject.toml

    # ~128 MB. download_model() pulls into the HF hub cache and copies out of
    # it, so caching the hub directory is enough. index.py declares HF_REPO and
    # HF_FILES, which makes it the right invalidation trigger.
    - name: Cache the embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: hf-${{ runner.os }}-bge-small-en-v1.5-${{ hashFiles('backend/src/prayer/api/build/index.py') }}
        restore-keys: hf-${{ runner.os }}-bge-small-en-v1.5-

    # 8.2 MB. ebible.org updates in place and offers no content hash, so bump
    # the version suffix to force a refresh.
    - name: Cache the WEB scripture archives
      uses: actions/cache@v4
      with:
        path: backend/data/vendor/web
        key: ebible-eng-web-v1

    # The Makefile defaults PY to venv/bin/python, which does not exist on a
    # runner, so every target that invokes Python needs the override — `fetch`
    # included, since it now runs prayer.extract.fetch rather than curl.
    - name: Install
      shell: bash
      run: make install PY=python

    - name: Fetch the source markdown
      shell: bash
      env:
        PRAYER_DATA_URL: ${{ inputs.data-url }}
      run: make fetch PY=python

    - name: Build datasets, text, index, queries and golden fixtures
      shell: bash
      env:
        HF_HUB_DISABLE_TELEMETRY: '1'
      run: make setup PY=python

    # Without this, a silently empty build would report "12 passed, 171
    # skipped" and look green — test_deterministic_golden.py skips at module
    # level when its fixture is absent, and the corpus fixtures would error.
    - name: Assert every artifact the suite needs exists
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for f in backend/data/build/datasets/sources/parks2021/prayers.jsonl \
                 backend/data/build/text/web.jsonl \
                 backend/data/build/bench/queries/tier1.jsonl \
                 backend/data/build/fixtures/golden_compositions.json \
                 backend/data/vendor/models/bge-small-en-v1.5/model.onnx; do
          if [ ! -s "$f" ]; then echo "::error::build produced no $f"; missing=1; fi
        done
        if ! compgen -G 'backend/data/build/index/*.npz' >/dev/null; then
          echo "::error::build produced no backend/data/build/index/*.npz"; missing=1
        fi
        [ "$missing" -eq 0 ] || exit 1
        echo "all build artifacts present"
