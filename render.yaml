# Render Blueprint. Must live at the repository root — Render's scanner only
# looks for render.yaml there, on the default branch.
services:
  - type: web
    name: word-and-whisper
    runtime: docker
    # Free and Starter are both 512 MB. The runtime holds an onnxruntime
    # session over a ~128 MB model plus the corpus and index, so start here and
    # downgrade only once the `docker stats` line in CI shows real headroom.
    plan: standard
    region: frankfurt
    branch: main

    # CI owns deployment: ci.yml deploys only after the suite passes. Leaving
    # this on would let an untested commit go live the moment it lands.
    autoDeploy: false

    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1

    envVars:
      # PRAYER_ROOT and PRAYER_HOST are already ENV in the Dockerfile; repeated
      # so this file alone describes the deployment.
      - key: PRAYER_ROOT
        value: /app
      - key: PRAYER_HOST
        value: "0.0.0.0"
      # Pinning PORT keeps the Dockerfile's hard-coded HEALTHCHECK
      # (127.0.0.1:8000) truthful. api/__main__.py reads PORT first, so this is
      # what uvicorn binds.
      - key: PORT
        value: "8000"
      - key: PRAYER_PORT
        value: "8000"
      # The source books are copyrighted and are not in this repository. Set
      # the value in the Render dashboard; Render forwards service env vars to
      # `docker build` as build args, which fills the Dockerfile's
      # ARG PRAYER_DATA_URL. Treat the URL as a credential and rotate it.
      - key: PRAYER_DATA_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
