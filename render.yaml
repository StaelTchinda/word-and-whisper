# Render Blueprint. Must live at the repository root — Render's scanner only
# looks for render.yaml there, on the default branch.
services:
  - type: web
    name: word-and-whisper-api
    runtime: docker
    # Measured on the real service: 73 MB at startup with the bm25 default,
    # rising to ~321 MB once a hybrid request loads the ONNX session. That fits
    # the 512 MB free instance with room to spare, so start free. Move up if
    # the `docker stats` line in CI trends toward ~450 MB.
    # Free instances also sleep after 15 minutes idle; the first request back
    # reloads the corpus and can take 30-60s.
    plan: free
    region: frankfurt
    branch: main

    # Render deploys itself the moment a commit lands on main. Safe because
    # main is a protected branch: only a PR can update it, and the PR can't
    # merge until quick/test/docker pass — so nothing untested ever reaches
    # the branch this watches. See the README's CI/CD section.
    autoDeploy: true

    dockerfilePath: ./backend/deploy/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    numInstances: 1

    envVars:
      # PRAYER_ROOT and PRAYER_HOST are already ENV in the Dockerfile; repeated
      # so this file alone describes the deployment.
      - key: PRAYER_ROOT
        value: /app
      - key: PRAYER_HOST
        value: "0.0.0.0"
      # Pinning PORT keeps the Dockerfile's hard-coded HEALTHCHECK
      # (127.0.0.1:8000) truthful. api/__main__.py reads PORT first, so this is
      # what uvicorn binds.
      - key: PORT
        value: "8000"
      - key: PRAYER_PORT
        value: "8000"
      # A direct-download link to a .zip (or .tar.gz) of data/input/. The
      # source books are copyrighted and are not in this repository. Set the
      # value in the Render dashboard; Render forwards service env vars to
      # `docker build` as build args, which fills the Dockerfile's
      # ARG PRAYER_DATA_URL. Anyone with the link can download it, so prefer a
      # host where you can swap the object behind the same name.
      - key: PRAYER_DATA_URL
        sync: false
      # onnxruntime allocates per-thread arenas. Four threads on a free
      # instance's fractional CPU buys nothing and costs memory, which is the
      # scarce resource at 512 MB. backend/configs/base.yaml says 4 for a laptop; this
      # overrides it here (environment outranks the YAML).
      - key: PRAYER_EMBEDDING_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"

  # The reader UI (frontend/). A static site, not the Docker service above --
  # own free plan, own URL, no CORS needed: the /api/* rewrite below proxies
  # server-side (Render "rewrite", not "redirect"), so frontend/src/api/client.ts's
  # relative fetch('/api/...') calls work in production exactly as they do
  # against frontend/vite.config.ts's dev proxy, unchanged.
  #
  # Named word-and-whisper (not word-and-whisper-web) deliberately: this is
  # the primary/human-facing URL. The API service above got renamed to
  # word-and-whisper-api to free this name up -- see the runbook for why that
  # needed a delete+recreate rather than an in-place rename.
  - type: web
    name: word-and-whisper
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main

    # Same reasoning as the API service above: safe to auto-deploy because
    # main only accepts commits that already passed CI via a required PR.
    autoDeploy: true

    routes:
      # CHECK THIS: assumes the API service above lands at
      # https://word-and-whisper-api.onrender.com (its name + Render's default
      # subdomain). It's a fresh service, so this should hold, but confirm
      # against the Render dashboard before relying on it.
      #
      # Must come before the /* fallback below -- Render evaluates routes in
      # order, and /* would otherwise match /api/* first and serve index.html
      # instead of proxying.
      - type: rewrite
        source: /api/*
        destination: https://word-and-whisper-api.onrender.com/*
      # SPA fallback for client-side routes (/, /sources/:id, /sources/:id/:itemId).
      # Render skips this for paths that already exist as built files (JS/CSS/etc),
      # so it never shadows a real asset under frontend/dist.
      - type: rewrite
        source: /*
        destination: /index.html
