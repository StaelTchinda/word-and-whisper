# Compose policy overlay — PRODUCT_BOOK section 7.2.
#
# The corpus is a catalogue of prayers in the Bible, not a catalogue of prayers
# you should pray. Some were prayed by hostile figures, and one is held up by
# the text itself as an example of how *not* to pray. Composing an earnest
# first-person prayer out of those would be a serious pastoral failure.
#
# Kept as data, not code, and separate from datasets/v1/ because the dataset is
# regenerated by tools/extract_parks.py and would overwrite an added column.
#
# >>> HUMAN SIGN-OFF REQUIRED <<<
# PRODUCT_BOOK section 11 item 2: the agent proposes, the human decides. Every
# entry below is a PROPOSAL with its reasoning stated so it can be argued with.
# Set `sign_off` to a name and date once reviewed.
#
# policy values:
#   compose       normal; the default for the 220 records not listed here
#   explain_only  retrieve and explain, but emit no spoken prayer
#   exclude       never retrieve

version: 1
sign_off: pending

prayers:

  # --- exclude -------------------------------------------------------------

  parks2021.0059:
    policy: exclude
    reason: >-
      1 Ki 18:26, the prophets of Baal on Carmel: "Baal, hear us!" The only
      prayer in the corpus addressed to someone other than God, and the
      narrative's whole point is that no one answered. There is no first-person
      prayer to compose from it and no situation for which it is the right
      suggestion.

  # --- explain_only --------------------------------------------------------

  parks2021.0202:
    policy: explain_only
    reason: >-
      Lk 18:11-12, the proud Pharisee: "God, I thank you that I am not like the
      rest of men." Luke frames this as a negative example -- the tax collector
      beside him is the one who goes home justified. Putting these words in a
      user's mouth would invert the passage's meaning. Worth retrieving and
      explaining when someone writes about self-righteousness or comparison.

  parks2021.0186:
    policy: explain_only
    reason: >-
      2 Mac 9:12, Antiochus IV Epiphanes. A persecutor's deathbed admission,
      narrated as his humiliation rather than offered as devotion. The content
      ("one who is mortal should not think they are equal to God") is sound,
      but it is a statement about him, not words written to be prayed.

  parks2021.0036:
    policy: explain_only
    reason: >-
      Jdg 21:18, "Cursed is he who gives a wife to Benjamin." Reported speech
      inside the Judges 19-21 atrocity narrative, and a curse against fellow
      Israelites that the book itself treats as part of the disaster. Nothing
      here belongs in anyone's mouth as prayer.

  # --- compose, with the imprecation rule applied (section 7.3) -------------
  # These stay retrievable and composable on purpose: Psalm 35 is exactly right
  # for someone being treated unjustly. The composer rule in composers/base
  # keeps the `ask` movement to justice, vindication and rescue, and leaves
  # judgment to God rather than putting a request for harm in the user's mouth.
  # Listed explicitly so the decision is visible rather than implicit.

  parks2021.0085: {policy: compose, reason: "Ps 10 — imprecation; ask restricted to justice and rescue."}
  parks2021.0088: {policy: compose, reason: "Ps 17 — imprecation; ask restricted to justice and rescue."}
  parks2021.0095: {policy: compose, reason: "Ps 35 — imprecation; ask restricted to justice and rescue."}
  parks2021.0136: {policy: compose, reason: "Je 18:19-23 — imprecation; ask restricted to justice and rescue."}
  parks2021.0137: {policy: compose, reason: "Je 20:7-18 — Jeremiah curses the day of his birth, not a person. A real lament for despair; ask restricted."}
  parks2021.0140: {policy: compose, reason: "Je 51:34-35 — imprecation against captors; ask restricted to justice and rescue."}
